
name: kernel release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: kernel-release
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: find latest upstream release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL --retry 3 \
            https://api.github.com/repos/poqdavid/android_kernel_samsung_sma155f/releases \
            -o upstream.json

          RELEASE=$(jq -c '
            [.[] |
              select(.draft == false and .prerelease == false) |
              select((.name // "") | test("^Stock optimized"; "i")) |
              select(any(.assets[]?; (.name | endswith(".tar"))))
            ][0] // empty
          ' upstream.json)

          if [ -z "$RELEASE" ]; then
            echo "::error::No matching Stock optimized release found."
            exit 1
          fi

          UPSTREAM_TAG=$(jq -r '.tag_name // empty' <<< "$RELEASE")
          TITLE=$(jq -r '.name // empty' <<< "$RELEASE")
          ARCHIVE_URL=$(jq -r \
            '.assets[] | select(.name | endswith(".tar")) | .browser_download_url' \
            <<< "$RELEASE" | head -n1)

          test -n "$UPSTREAM_TAG"
          test -n "$ARCHIVE_URL"

          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=ksun-lkm-$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "archive_url=$ARCHIVE_URL" >> "$GITHUB_OUTPUT"

      - name: skip existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: download and validate stock boot image
        if: steps.check.outputs.exists == 'false'
        env:
          ARCHIVE_URL: ${{ steps.upstream.outputs.archive_url }}
        run: |
          set -euo pipefail

          curl -fL --retry 3 --retry-all-errors \
            "$ARCHIVE_URL" -o stock.tar

          tar -tf stock.tar >/dev/null
          mkdir extracted
          tar -xf stock.tar -C extracted

          mapfile -t BOOTS < <(
            find extracted -type f -name boot.img
          )

          if [ "${#BOOTS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one boot.img in upstream archive."
            exit 1
          fi

          cp "${BOOTS[0]}" boot.img
          test -s boot.img

      - name: download KernelSU-Next tools
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail

          curl -fsSL --retry 3 \
            https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest \
            -o ksu-release.json

          MODULE_URL=$(jq -r '
            [.assets[] |
              select(.name == "aarch64_android12-5.10_kernelsu.ko") |
              .browser_download_url][0] // empty
          ' ksu-release.json)

          KSUD_URL=$(jq -r '
            [.assets[] |
              select(.name == "ksud-x86_64-unknown-linux-musl") |
              .browser_download_url][0] // empty
          ' ksu-release.json)

          if [ -z "$MODULE_URL" ] || [ -z "$KSUD_URL" ]; then
            echo "::error::Required KernelSU-Next release assets were not found."
            exit 1
          fi

          curl -fL --retry 3 --retry-all-errors \
            "$MODULE_URL" -o kernelsu.ko
          curl -fL --retry 3 --retry-all-errors \
            "$KSUD_URL" -o ksud

          test -s kernelsu.ko
          chmod +x ksud
          ./ksud --help

      - name: patch and package boot image
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail

          mkdir -p release

          ./ksud boot-patch-v2 \
            --boot boot.img \
            --output release/boot.img \
            --module kernelsu.ko

          test -s release/boot.img

          tar -C release -cf \
            release/android_kernel_samsung_sma155f_lkm.tar boot.img

          (
            cd release
            sha256sum boot.img \
              android_kernel_samsung_sma155f_lkm.tar \
              > sha256sums.txt
          )

          tar -tf release/android_kernel_samsung_sma155f_lkm.tar |
            grep -Fxq boot.img

          (
            cd release
            sha256sum -c sha256sums.txt
          )

      - name: publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
          UPSTREAM_TITLE: ${{ steps.upstream.outputs.title }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          Automated KernelSU-Next LKM patch of the upstream Stock optimized kernel.

          - Upstream release: ${UPSTREAM_TITLE}
          - Upstream tag: ${UPSTREAM_TAG}
          - Device: Samsung Galaxy A15 4G (SM-A155F)
          - Kernel: Linux 5.10 / ARM64
          - Patching: KernelSU-Next LKM

          ## Assets

          - \`boot.img\`: patched boot image
          - \`android_kernel_samsung_sma155f_lkm.tar\`: archive containing boot.img
          - \`sha256sums.txt\`: SHA-256 checksums for both files

          ## Credits

          - poqdavid: original Stock optimized kernel
          - KernelSU-Next: LKM implementation and patching tools

          Verify firmware compatibility and keep the original boot image
          before flashing.
          EOF

          gh release create "$RELEASE_TAG" \
            release/boot.img \
            release/android_kernel_samsung_sma155f_lkm.tar \
            release/sha256sums.txt \
            --title "Stock optimized (${UPSTREAM_TAG}) - KernelSU-Next LKM" \
            --notes-file release-notes.md
